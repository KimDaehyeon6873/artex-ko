# local-vm.sh 가 .local-vm/compose.env 를 준비한 뒤 이 파일을 사용한다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_DB: artex
      POSTGRES_PASSWORD: ${ARTEX_VM_DB_PASSWORD:?local-vm.sh 를 먼저 실행하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  artex:
    build:
      context: .
      dockerfile: Dockerfile.local-vm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${ARTEX_VM_DB_PASSWORD:?local-vm.sh 를 먼저 실행하세요}@postgres:5432/artex?sslmode=disable
      ARTEX_SKILL_DIR: /app/skills
    ports:
      - "127.0.0.1:${ARTEX_VM_HTTP_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_VM_PROXY_PORT:-8788}:8788"
    # Linux VM 호스트의 테스트 서비스는 host.docker.internal 로 접근할 수 있다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/app/data
      - private:/var/lib/artex-private
      - skills:/app/skills
      - home:/home/artex
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 512
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).close()"
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  data:
  private:
  skills:
  home:
